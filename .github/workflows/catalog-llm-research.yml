name: Catalog LLM research

# Claude / Gemini handle research against the cached catalog.
# Preferred provider is Gemini when GEMINI_API_KEY (or an alias) is set.
#
# Spend is disclosed before it happens. The `plan` job always runs first and
# prints what each job researches, what is sent, what may be written, and the
# cost range (also on the run summary). It sends nothing. The `spend` job runs
# only on workflow_dispatch with Accept spend checked, and it sits behind the
# `llm-spend` environment so a required reviewer can read the plan and approve.
# Bumping data/llm-request only ever produces the plan.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max rows this job (cues = clocked stubs, not DJs)"
        required: false
        default: "24"
        type: string
      jobs:
        description: "Comma list, or all / cues (cue = cues)"
        required: false
        default: "handles,events,quality"
        type: string
      apply:
        description: "1 write / 0 dry-run (dry-run skips Pages)"
        required: false
        default: "0"
        type: string
      confirm_spend:
        description: "Accept spend — Gemini ≈ $0.015–$0.045 / call, Claude ≈ $0.008–$0.025 / call. handles+events+quality cap 24 ≈ $0.77–$2.30 Gemini. Unchecked = plan only, nothing is sent."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/llm-request"

permissions:
  contents: read
  actions: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  # Discloses what would be researched and the cost. Never calls a model.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Print LLM research plan (sends nothing)
        env:
          LLM_RESEARCH_LIMIT: ${{ github.event.inputs.limit || '24' }}
          LLM_RESEARCH_JOBS: ${{ github.event.inputs.jobs || 'handles,events,quality' }}
          LLM_RESEARCH_APPLY: ${{ github.event.inputs.apply || '0' }}
        run: npm run research:plan

      - name: Note how to approve
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.confirm_spend != 'true'
        run: |
          echo "::notice::Plan only — no model was called. To spend, run Actions → Catalog LLM research with Accept spend checked."

  research:
    needs: plan
    # Hard gate: add yourself as a required reviewer on the llm-spend
    # environment (Settings → Environments) and Actions will pause here
    # until someone reads the plan above and approves.
    environment: llm-spend
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_spend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Restore catalog DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Require catalog
        run: |
          if [ ! -f prisma/dev.db ]; then
            echo "::error::No catalog DB in cache. Run Catalog deep refresh first."
            exit 1
          fi
          npx prisma migrate deploy
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Catalog sets=$SETS"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Catalog too small ($SETS)."
            exit 1
          fi

      - name: Check LLM secrets
        id: keys
        env:
          CLAUDE_AGENT_API: ${{ secrets.CLAUDE_AGENT_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_AGENT_API || secrets.GEMINI || secrets.GOOGLE_API_KEY }}
        run: |
          set -euo pipefail
          GEMINI=$(printf '%s' "$GEMINI_API_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLAUDE=$(printf '%s' "${CLAUDE_AGENT_API:-$ANTHROPIC_API_KEY}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "gemini_key_len=${#GEMINI} claude_key_len=${#CLAUDE}"
          if [ -z "$GEMINI" ] && [ -z "$CLAUDE" ]; then
            echo "::error::Set GEMINI_API_KEY (AI Studio) and/or CLAUDE_AGENT_API."
            exit 1
          fi
          if [ -n "$GEMINI" ]; then
            echo "provider=gemini" >> "$GITHUB_OUTPUT"
          else
            echo "provider=claude" >> "$GITHUB_OUTPUT"
          fi

      # Reprints the plan, then spends. Approved above via the llm-spend
      # environment plus the Accept spend checkbox.
      - name: LLM handle research (approved spend)
        env:
          CLAUDE_AGENT_API: ${{ secrets.CLAUDE_AGENT_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_AGENT_API || secrets.GEMINI || secrets.GOOGLE_API_KEY }}
          LLM_RESEARCH_LIMIT: ${{ github.event.inputs.limit || '24' }}
          LLM_RESEARCH_JOBS: ${{ github.event.inputs.jobs || 'handles,events,quality' }}
          LLM_RESEARCH_APPLY: ${{ github.event.inputs.apply || '0' }}
          LLM_RESEARCH_CONFIRM: "1"
          LLM_QUALITY: "1"
        run: npm run research:handles

      - name: Upload LLM research report
        uses: actions/upload-artifact@v4
        with:
          name: llm-research
          path: |
            data/crosscheck/llm-handle-research.json
            data/crosscheck/llm-quality-check.json
            data/crosscheck/llm-cue-research.json
            data/crosscheck/llm-track-id-research.json
          if-no-files-found: warn

      - name: Save catalog DB
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Dispatch Pages deploy
        if: success() && (github.event.inputs.apply || '0') != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: context.ref,
              inputs: { mode: 'fast' },
            });
            core.info('Dispatched Deploy to GitHub Pages (fast) after LLM research.');
