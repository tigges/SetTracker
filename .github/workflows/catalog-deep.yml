name: Catalog deep refresh

# Heavy crawl — separate from push deploys so code review stays fast.
# Saves prisma/dev.db + discovery graph for the Pages deploy workflow.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Wipe DB and re-seed before crawl (emergency only)"
        required: false
        default: false
        type: boolean
  # Agents often lack workflow_dispatch; bump data/deep-request on main to start.
  push:
    branches: [main]
    paths:
      - "data/deep-request"

# Deploy is delegated to deploy-pages.yml, so this workflow only needs to read
# code and dispatch that workflow (no direct Pages publish).
permissions:
  contents: read
  actions: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      INGEST_MODE: deep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Restore discovery + poll state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artist-candidates.json
            data/artist-relations.json
            data/venue-candidates.json
            data/roster-graduates.json
            data/soundcloud-poll-state.json
          key: setradar-discovery-${{ github.run_id }}
          restore-keys: |
            setradar-discovery-

      - name: Restore last catalog DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Prepare catalog (incremental or bootstrap)
        env:
          FORCE_BOOTSTRAP: ${{ inputs.bootstrap == true && '1' || '0' }}
        run: |
          set -euo pipefail
          BOOTSTRAP=0
          if [ "$FORCE_BOOTSTRAP" = "1" ]; then
            echo "Manual bootstrap requested"
            BOOTSTRAP=1
          elif [ ! -f prisma/dev.db ]; then
            echo "No catalog DB in cache — bootstrapping"
            BOOTSTRAP=1
          else
            npx prisma migrate deploy
            SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
            echo "Restored catalog sets=$SETS (matched=${{ steps.dbcache.outputs.cache-matched-key }})"
            if [ "${SETS:-0}" -lt 50 ]; then
              echo "Catalog too small ($SETS) — bootstrapping"
              BOOTSTRAP=1
            else
              echo "Incremental deep — keeping restored catalog (sourceHash skips unchanged sets)"
            fi
          fi

          if [ "$BOOTSTRAP" = "1" ]; then
            rm -f prisma/dev.db prisma/dev.db-journal
            npx prisma migrate deploy
            npx prisma db seed
          fi

      - name: Deep crawl (incremental)
        env:
          INGEST_SKIP_VERIFY: "1"
          YOUTUBE_ARTIST_VIDEO_LIMIT: "30"
          YOUTUBE_ARTIST_VIDEO_LIMIT_HIGH: "60"
          YOUTUBE_VENUE_VIDEO_LIMIT: "25"
          YOUTUBE_CONTINUATION_PAGES: "3"
          YOUTUBE_RELATED_PER_VIDEO: "3"
          YOUTUBE_RELATED_GLOBAL_CAP: "36"
          YOUTUBE_SHELF_VIDEO_CAP: "10"
          YOUTUBE_SIMILAR_CHANNEL_CAP: "20"
          SOUNDCLOUD_ARTIST_TRACK_LIMIT: "50"
          # Niche supplement — keep well below SC/YT volume.
          HEARTHIS_MAX_SETS: "12"
          INSOMNIAC_NOR_MAX: "60"
          INSOMNIAC_NOR_LIST_PAGES: "10"
          INSOMNIAC_MIXES_MAX: "30"
          INSOMNIAC_MIXES_LIST_PAGES: "4"
          DISCOVERY_PROMOTE_SCORE: "28"
          DISCOVERY_PROMOTE_CAP: "48"
        run: npm run ingest

      - name: Graduate promoted artists into roster
        env:
          DISCOVERY_GRADUATE_SCORE: "40"
          DISCOVERY_GRADUATE_CAP: "20"
        run: npm run graduate-roster

      # Hot path: fill missing art only. Full DJ refresh + MusicBrainz → weekly enrich.
      - name: Resolve missing artwork (incremental)
        env:
          THUMBS_DELAY_MS: "100"
          THUMBS_NULL_ONLY: "1"
          THUMBS_MB_LIMIT: "0"
        run: npm run thumbs

      - name: Verify social / website URLs (once)
        env:
          VERIFY_URLS_CURATED_ONLY: "0"
          # Fill missing official club / festival / DJ sites (DJ Mag + Wikidata).
          DJMAG_ENRICH_OFFICIAL: "1"
          DJMAG_ENRICH_FESTIVALS: "1"
          DJMAG_ENRICH_DJS: "1"
          DJMAG_OFFICIAL_LIMIT: "100"
        run: npm run verify-urls

      - name: Guard catalog size
        run: |
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Catalog sets=$SETS"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Deep crawl left only $SETS sets — refusing to save/deploy."
            exit 1
          fi

      # Catalog-internal density audit (duration vs play count). Not Songkick.
      - name: Cross-check set tracklist density
        run: npm run crosscheck:set-density

      - name: Soft-attach events from set titles
        run: npm run backfill:set-events
        continue-on-error: true

      - name: Audit Top100 completeness
        run: npm run audit:top100
        continue-on-error: true

      - name: Rebuild next-captures + held Relive watch + ACR preview
        run: |
          npm run build:next-captures
          npm run preview:acr-queue
          npx tsx scripts/report-roster-graduates.ts

      - name: Upload set-density report
        uses: actions/upload-artifact@v4
        with:
          name: set-density
          path: |
            data/crosscheck/set-density.json
            data/crosscheck/next-captures.json
            data/crosscheck/held-relive-watch.json
            data/crosscheck/acr-queue-preview.json
            data/crosscheck/roster-graduate-report.json
            data/crosscheck/top100-coverage.json
          if-no-files-found: warn

      - name: Catalog social fill (null-only)
        env:
          CATALOG_YT_SOCIALS_LIMIT: "40"
          CATALOG_SC_SOCIALS_LIMIT: "40"
        run: |
          npm run catalog-yt-socials || true
          npm run catalog-sc-socials || true

      # Claude / Gemini propose handles; we only write live URLs that match the DJ name.
      # No-op when ANTHROPIC_API_KEY / GEMINI_API_KEY are unset.
      - name: LLM handle research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_RESEARCH_LIMIT: "16"
          LLM_QUALITY: "1"
        run: npm run research:handles
        continue-on-error: true

      - name: Upload LLM research report
        uses: actions/upload-artifact@v4
        with:
          name: llm-research
          path: |
            data/crosscheck/llm-handle-research.json
            data/crosscheck/llm-quality-check.json
          if-no-files-found: warn

      - name: Save catalog DB
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Save discovery + poll state
        uses: actions/cache/save@v4
        with:
          path: |
            data/artist-candidates.json
            data/artist-relations.json
            data/venue-candidates.json
            data/roster-graduates.json
            data/soundcloud-poll-state.json
          key: setradar-discovery-${{ github.run_id }}

      # Single deployer: hand the refreshed catalog to deploy-pages.yml (which
      # restores the just-saved DB cache, builds, and publishes). Keeps all
      # Pages build/verify/deploy logic in one workflow.
      - name: Dispatch Pages deploy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: context.ref,
              inputs: { mode: 'fast' },
            });
            core.info('Dispatched Deploy to GitHub Pages (fast) after deep crawl.');
