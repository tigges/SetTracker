name: Deploy to GitHub Pages

# Single deployer: the ONLY workflow that builds + publishes Pages.
# Producers (catalog-deep, catalog-enrich) save the DB cache then dispatch this
# workflow — they no longer build/deploy themselves.
# Push = restore cached catalog → light curated ingest only if YT/SC/1001
# sources changed → apply pins → static export (always includes /stats).
# Dispatch from deep/enrich never re-polls. ingest=force is the manual crawl.
# Deep catalog refresh lives in catalog-deep.yml (separate concurrency group).
on:
  push:
    branches: [main]
    paths-ignore:
      # These bumps start producer workflows that dispatch us when done.
      # A push here must not also start a 45-min ingest+export.
      - "data/deep-request"
      - "data/enrich-request"
      - "data/enrich-full-request"
      - "data/llm-request"
      - "data/db-export-request"
      - "data/acr-diagnose-request"
      - "data/acr-smoke-request"
      - "**/*.md"
      - ".github/workflows/catalog-*.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Fast ship from cached catalog (deep crawl is Catalog deep refresh)"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
      ingest:
        description: "Curated YT/SC poll (auto skips when sources unchanged; dispatch skips)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - skip
          - force

permissions:
  contents: read
  pages: write
  id-token: write
  # /stats last-run chip — list enrich / deep / Pages without writing anything.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INGEST_MODE: fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Restore discovery candidate graph
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artist-candidates.json
            data/artist-relations.json
            data/venue-candidates.json
            data/roster-graduates.json
            data/soundcloud-poll-state.json
            data/crosscheck/official-site-miss.json
            data/crosscheck/url-probe.json
          key: setradar-discovery-${{ github.run_id }}
          restore-keys: |
            setradar-discovery-

      # Restore BEFORE migrate so we don't create an empty DB that confuses checks.
      # NOTE: actions/cache sets cache-hit=true only on exact key match. Restore-key
      # hits leave cache-hit=false even when prisma/dev.db was restored — never use
      # cache-hit alone to decide whether to seed (that wiped 270→42 sets).
      - name: Restore last catalog DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-${{ github.run_id }}-
            setradar-db-

      - name: Require restored catalog
        run: |
          if [ ! -f prisma/dev.db ]; then
            echo "::error::No catalog DB in Actions cache. Run Actions → Catalog deep refresh."
            exit 1
          fi
          npx prisma migrate deploy
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Restored catalog sets=$SETS (cache-hit=${{ steps.dbcache.outputs.cache-hit }} matched=${{ steps.dbcache.outputs.cache-matched-key }})"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Restored catalog has only $SETS sets (expected 50+). Run Catalog deep refresh."
            exit 1
          fi

      # Curated ingest is the expensive "detection" (YT/SC watch + thumbs).
      # 1001 live HTML is never fetched here (Cloudflare). Clock overlays
      # apply in verify-urls. Push polls only when YT/SC/roster seeds
      # changed — not artists.ts / 1001 captures. Dispatch never re-polls.
      # ingest=force is the manual re-poll.
      - name: Decide curated ingest
        id: need_ingest
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PAGES_INGEST: ${{ github.event.inputs.ingest || 'auto' }}
        run: |
          set -euo pipefail
          LIST=$(mktemp)
          NO_PREV=""
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              NO_PREV="--no-previous-sha"
            else
              git fetch --depth=1 origin "$BEFORE_SHA" || true
              git diff --name-only "$BEFORE_SHA" "${{ github.sha }}" > "$LIST" || true
              echo "Changed files vs $BEFORE_SHA:"
              cat "$LIST" || true
            fi
          fi
          npx tsx scripts/pages-need-curated-ingest.ts \
            --event "$EVENT_NAME" \
            --ingest "$PAGES_INGEST" \
            --changed-file-list "$LIST" \
            $NO_PREV | tee /tmp/need-ingest.txt
          grep -E '^(run|reason)=' /tmp/need-ingest.txt >> "$GITHUB_OUTPUT"
          echo "need_ingest=$(grep '^run=' /tmp/need-ingest.txt | cut -d= -f2)"

      # Light curated ingest so new sample sets land without catalog-deep:
      # YouTube watch-list + SoundCloud playlists (e.g. Lift Sets / Dom Dolla Live).
      # Do not set INGEST_ALLOW_1001_FETCH — CI cannot read 1001tracklists.com.
      - name: Ingest curated YouTube + SoundCloud playlists
        if: steps.need_ingest.outputs.run == '1'
        env:
          INGEST_ADAPTERS: "youtube,soundcloud"
          YOUTUBE_CURATED_ONLY: "1"
          # Keep curated playlists (e.g. BISCITS Live Streams) on the fast path.
          YOUTUBE_CURATED_PLAYLISTS: "1"
          SOUNDCLOUD_CURATED_ONLY: "1"
          INGEST_SKIP_VERIFY: "1"
          # New curated seeds only — do not re-watch catalogued YT/SC rows.
          # 1001 clocks overlay in verify-urls.
          INGEST_SKIP_EXISTING_CURATED: "1"
          # Pages is overlay + poll, not discovery. Crosslink/social harvest
          # belongs on catalog-deep (saved ~minutes on the last 1001 ship).
          INGEST_LEAN: "1"
        run: npm run ingest

      - name: Fill missing thumbs only
        if: steps.need_ingest.outputs.run == '1'
        env:
          THUMBS_DELAY_MS: "80"
          THUMBS_NULL_ONLY: "1"
          THUMBS_MB_LIMIT: "0"
        run: npm run thumbs

      - name: Apply curated URL fixes
        env:
          VERIFY_URLS_CURATED_ONLY: "1"
        run: npm run verify-urls

      # Keep the cache key warm after pins / optional ingest
      # (catalog-deep remains the heavy writer).
      - name: Re-save catalog DB
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Restore Next.js compile cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: setradar-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            setradar-next-${{ hashFiles('package-lock.json') }}-
            setradar-next-

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Read app version
        id: app_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # GitHub Pages is a full snapshot. Next `output: "export"` has no ISR,
      # so every ship regenerates /, /stats, set/dj/track HTML from the current
      # catalog DB (~8 min). Compile cache only speeds bundling.
      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          # Custom domain (setradar.ai) is served at the domain root.
          # `/SetTracker` prefixes make CSS/JS 404 on the apex.
          PAGES_BASE_PATH: ""
          # Footer counter — bump package.json version on every release.
          NEXT_PUBLIC_APP_VERSION: ${{ steps.app_version.outputs.version }}
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Verify export is the app (not README)
        run: |
          test -f out/index.html
          grep -qi "setradar" out/index.html
          grep -qi "SETRADAR" out/index.html
          if grep -q '/SetTracker/_next' out/index.html; then
            echo "::error::Export still prefixes /SetTracker — setradar.ai would load unstyled"
            exit 1
          fi
          test -f out/SetTracker/index.html
          grep -qi "location.replace" out/SetTracker/index.html
          test ! -d out/cache
          test ! -d out/server
          test -d out/sets
          test -d out/djs
          test -d out/events
          test -d out/venues
          test -f out/stats/index.html
          grep -qi "catalog health" out/stats/index.html
          grep -qi "fill thin lists" out/stats/index.html
          grep -qi "pin handles" out/stats/index.html
          grep -qi "export for claude complete" out/stats/index.html
          SET_PAGES=$(find out/sets -mindepth 1 -maxdepth 1 -type d ! -name '_placeholder' | wc -l)
          DJ_PAGES=$(find out/djs -mindepth 1 -maxdepth 1 -type d ! -name '_placeholder' | wc -l)
          TRACK_PAGES=$(find out/tracks -mindepth 1 -maxdepth 1 -type d ! -name '_placeholder' 2>/dev/null | wc -l)
          echo "Exported set pages: $SET_PAGES dj=$DJ_PAGES track=$TRACK_PAGES"
          du -sh out out/sets out/djs out/tracks out/events out/venues out/stats out/_next 2>/dev/null || true
          if [ "$SET_PAGES" -lt 50 ]; then
            echo "::error::Export only has $SET_PAGES set pages — refusing to deploy a wiped catalog."
            exit 1
          fi

      # GitHub Pages unpacks the artifact and rejects >10GB (or leftover
      # symlinks/hard links). Next 16 static export was 10.77GB / 1.85GB zip —
      # just over the unpack cap. Drop the duplicate full-tree RSC copy first;
      # if still over, drop remaining page `.txt` payloads (HTML still serves).
      - name: Slim export under Pages 10GB unpack limit
        run: |
          set -euo pipefail
          echo "Before slim:"
          du -sh out out/sets out/djs out/tracks 2>/dev/null || true
          FULL=$(find out -name '__next._full.txt' | wc -l)
          find out -name '__next._full.txt' -delete
          echo "Removed $FULL __next._full.txt copies"
          RAW=$(du -sb out | awk '{print $1}')
          echo "After _full drop: $RAW bytes"
          if [ "$RAW" -gt 9200000000 ]; then
            TXT=$(find out -name '*.txt' ! -path 'out/_next/*' | wc -l)
            find out -name '*.txt' ! -path 'out/_next/*' -delete
            echo "Still over 9.2GB — removed $TXT RSC .txt payloads"
          fi
          LINKS=$(find out -type l | wc -l)
          HARDS=$(find out -type f -links +1 | wc -l)
          RAW=$(du -sb out | awk '{print $1}')
          echo "Slim export bytes=$RAW symlinks=$LINKS hardlinked_files=$HARDS"
          du -sh out out/sets out/djs out/tracks 2>/dev/null || true
          if [ "$LINKS" -gt 0 ] || [ "$HARDS" -gt 0 ]; then
            tmp=$(mktemp -d)
            rsync -a --copy-links --no-hard-links out/ "$tmp/"
            rm -rf out
            mv "$tmp" out
            RAW=$(du -sb out | awk '{print $1}')
            echo "Flattened export bytes=$RAW"
          fi
          if [ "$RAW" -gt 10000000000 ]; then
            echo "::error::Export still $RAW bytes (Pages unpack limit 10GB)."
            exit 1
          fi

      - name: Save Next.js compile cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: setradar-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
