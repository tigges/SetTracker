name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Full deep crawl on a schedule; push deploys stay light/fast.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ingest depth"
        required: true
        default: "deep"
        type: choice
        options:
          - light
          - deep

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Push → light (minutes). Schedule / manual deep → full roster scan.
      INGEST_MODE: ${{ github.event_name == 'schedule' && 'deep' || github.event_name == 'workflow_dispatch' && inputs.mode || 'light' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create and seed the SQLite database (build-time data)
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Crawl sources (light — fast push deploys)
        if: env.INGEST_MODE == 'light'
        env:
          YOUTUBE_ARTIST_VIDEO_LIMIT: "6"
          YOUTUBE_ARTIST_VIDEO_LIMIT_HIGH: "10"
          YOUTUBE_VENUE_VIDEO_LIMIT: "8"
          YOUTUBE_CONTINUATION_PAGES: "0"
          SOUNDCLOUD_ARTIST_TRACK_LIMIT: "12"
          HEARTHIS_MAX_SETS: "20"
        run: npm run ingest

      - name: Crawl sources (deep — schedule / manual)
        if: env.INGEST_MODE == 'deep'
        env:
          YOUTUBE_ARTIST_VIDEO_LIMIT: "40"
          YOUTUBE_ARTIST_VIDEO_LIMIT_HIGH: "60"
          YOUTUBE_VENUE_VIDEO_LIMIT: "35"
          YOUTUBE_CONTINUATION_PAGES: "3"
          SOUNDCLOUD_ARTIST_TRACK_LIMIT: "50"
        run: npm run ingest

      - name: Resolve artwork thumbnails (Deezer)
        run: npm run thumbs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/SetTracker"
        run: npm run build

      - name: Verify export is the app (not README)
        run: |
          test -f out/index.html
          grep -q "setradar.ai" out/index.html
          # Guard against accidentally uploading a Next build cache
          test ! -d out/cache
          test ! -d out/server
          ls out | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
