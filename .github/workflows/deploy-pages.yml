name: Deploy to GitHub Pages

# Push = fast path (no crawl). Catalog refresh = schedule / manual only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "push-speed (no crawl) or deep catalog refresh"
        required: true
        default: "deep"
        type: choice
        options:
          - fast
          - deep

permissions:
  contents: read
  pages: write
  id-token: write

# Fast push deploys cancel an in-flight deep crawl so review isn't blocked.
# Deep/schedule never cancels a fast deploy already shipping the site.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only cron + manual "deep" crawl the web. Everything else is instant.
      INGEST_MODE: ${{ github.event_name == 'schedule' && 'deep' || github.event_name == 'workflow_dispatch' && inputs.mode || 'fast' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Restore last catalog DB (skip crawl on push)
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Seed fallback DB (only if no cached catalog)
        if: steps.dbcache.outputs.cache-hit != 'true' && env.INGEST_MODE == 'fast'
        env:
          # Empty sets break Next static export (generateStaticParams).
          # Mocks only until a deep crawl populates the Actions cache.
          SEED_MOCK_SETS: "1"
        run: npx prisma db seed

      - name: Seed before deep crawl
        if: env.INGEST_MODE == 'deep'
        run: npx prisma db seed

      - name: Deep crawl (schedule / manual only)
        if: env.INGEST_MODE == 'deep'
        env:
          YOUTUBE_ARTIST_VIDEO_LIMIT: "40"
          YOUTUBE_ARTIST_VIDEO_LIMIT_HIGH: "60"
          YOUTUBE_VENUE_VIDEO_LIMIT: "35"
          YOUTUBE_CONTINUATION_PAGES: "3"
          SOUNDCLOUD_ARTIST_TRACK_LIMIT: "50"
        run: npm run ingest

      - name: Resolve artwork thumbnails (Deezer)
        if: env.INGEST_MODE == 'deep'
        run: npm run thumbs

      - name: Fill missing thumbs only (fast path)
        if: env.INGEST_MODE == 'fast'
        env:
          THUMBS_DELAY_MS: "80"
          THUMBS_NULL_ONLY: "1"
        run: npm run thumbs

      - name: Verify social / website URLs
        if: env.INGEST_MODE == 'deep'
        run: npm run verify-urls

      - name: Save catalog DB for fast push deploys
        if: env.INGEST_MODE == 'deep'
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/SetTracker"
          NEXT_PUBLIC_APP_VERSION: "0.2.0"
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify export is the app (not README)
        run: |
          test -f out/index.html
          grep -qi "setradar" out/index.html
          # App shell, not the repo README Jekyll page
          grep -qi "SETRADAR" out/index.html
          test ! -d out/cache
          test ! -d out/server
          # Dynamic routes must have been generated (empty DB used to fail here)
          test -d out/sets
          test -d out/djs
          test -d out/venues

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
