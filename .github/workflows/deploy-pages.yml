name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Regularly crawl sources for new sets & DJs and redeploy the static site.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create and seed the SQLite database (build-time data)
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Crawl sources for new sets & DJs
        run: npm run ingest

      - name: Resolve artwork thumbnails (Deezer)
        run: npm run thumbs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/SetTracker"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
