name: Deploy to GitHub Pages

# Push = fast path (no crawl). Catalog refresh = schedule / manual only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "push-speed (no crawl) or deep catalog refresh"
        required: true
        default: "deep"
        type: choice
        options:
          - fast
          - deep

permissions:
  contents: read
  pages: write
  id-token: write

# Fast push deploys cancel an in-flight deep crawl so review isn't blocked.
# Deep/schedule never cancels a fast deploy already shipping the site.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only cron + manual "deep" crawl the web. Everything else is instant.
      INGEST_MODE: ${{ github.event_name == 'schedule' && 'deep' || github.event_name == 'workflow_dispatch' && inputs.mode || 'fast' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Persist discovery graph across deep runs (candidates grow each crawl).
      - name: Restore discovery candidate graph
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artist-candidates.json
            data/artist-relations.json
            data/venue-candidates.json
            data/roster-graduates.json
          key: setradar-discovery-${{ github.run_id }}
          restore-keys: |
            setradar-discovery-

      # Restore BEFORE migrate so we don't create an empty DB that confuses checks.
      # NOTE: actions/cache sets cache-hit=true only on exact key match. Restore-key
      # hits leave cache-hit=false even when prisma/dev.db was restored — never use
      # cache-hit alone to decide whether to seed (that wiped 270→42 sets).
      - name: Restore last catalog DB (skip crawl on push)
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Require restored catalog on fast path
        if: env.INGEST_MODE == 'fast'
        run: |
          if [ ! -f prisma/dev.db ]; then
            echo "::error::No catalog DB in Actions cache. Re-run Actions → Deploy → mode=deep."
            exit 1
          fi
          # Apply migrations onto the restored catalog (not an empty file).
          npx prisma migrate deploy
          # "Set" must be quoted — Set is a reserved word in SQLite.
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Restored catalog sets=$SETS (cache-hit=${{ steps.dbcache.outputs.cache-hit }} matched=${{ steps.dbcache.outputs.cache-matched-key }})"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Restored catalog has only $SETS sets (expected 50+). Refusing mock seed. Re-run deep deploy."
            exit 1
          fi

      - name: Seed before deep crawl
        if: env.INGEST_MODE == 'deep'
        run: |
          # Fresh schema + artist skeleton; ingest fills real sets.
          rm -f prisma/dev.db prisma/dev.db-journal
          npx prisma migrate deploy
          npx prisma db seed

      - name: Deep crawl (schedule / manual only)
        if: env.INGEST_MODE == 'deep'
        env:
          YOUTUBE_ARTIST_VIDEO_LIMIT: "40"
          YOUTUBE_ARTIST_VIDEO_LIMIT_HIGH: "60"
          YOUTUBE_VENUE_VIDEO_LIMIT: "35"
          YOUTUBE_CONTINUATION_PAGES: "3"
          # Related / Fans also like / Spotlight expansion
          YOUTUBE_RELATED_PER_VIDEO: "4"
          YOUTUBE_RELATED_GLOBAL_CAP: "48"
          YOUTUBE_SHELF_VIDEO_CAP: "12"
          YOUTUBE_SIMILAR_CHANNEL_CAP: "24"
          SOUNDCLOUD_ARTIST_TRACK_LIMIT: "50"
          # Expand artist graph each deep run (lineup/press/B2B → promote → poll).
          DISCOVERY_PROMOTE_SCORE: "28"
          DISCOVERY_PROMOTE_CAP: "48"
        run: npm run ingest

      - name: Graduate promoted artists into roster
        if: env.INGEST_MODE == 'deep'
        env:
          DISCOVERY_GRADUATE_SCORE: "40"
          DISCOVERY_GRADUATE_CAP: "20"
        run: npm run graduate-roster

      - name: Resolve artwork + track meta (Deezer / MusicBrainz)
        if: env.INGEST_MODE == 'deep'
        env:
          THUMBS_MB_LIMIT: "60"
        run: npm run thumbs

      - name: Fill missing thumbs only (fast path)
        if: env.INGEST_MODE == 'fast'
        env:
          THUMBS_DELAY_MS: "80"
          THUMBS_NULL_ONLY: "1"
        run: npm run thumbs

      - name: Verify social / website URLs
        # Deep: probe + curated fixes. Fast: curated fixes only (Divided Souls etc.).
        env:
          VERIFY_URLS_CURATED_ONLY: ${{ env.INGEST_MODE == 'fast' && '1' || '0' }}
        run: npm run verify-urls

      - name: Save catalog DB for fast push deploys
        if: env.INGEST_MODE == 'deep'
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Save discovery candidate graph
        if: env.INGEST_MODE == 'deep'
        uses: actions/cache/save@v4
        with:
          path: |
            data/artist-candidates.json
            data/artist-relations.json
            data/venue-candidates.json
            data/roster-graduates.json
          key: setradar-discovery-${{ github.run_id }}

      # Also refresh cache after a good fast deploy so the key stays warm.
      - name: Re-save catalog DB after fast path
        if: env.INGEST_MODE == 'fast'
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: "/SetTracker"
          NEXT_PUBLIC_APP_VERSION: "0.2.8"
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify export is the app (not README)
        run: |
          test -f out/index.html
          grep -qi "setradar" out/index.html
          grep -qi "SETRADAR" out/index.html
          test ! -d out/cache
          test ! -d out/server
          test -d out/sets
          test -d out/djs
          test -d out/venues
          # Guard: static export must include a real catalog, not mock seed (~42 sets)
          SET_PAGES=$(find out/sets -mindepth 1 -maxdepth 1 -type d ! -name '_placeholder' | wc -l)
          echo "Exported set pages: $SET_PAGES"
          if [ "$SET_PAGES" -lt 50 ]; then
            echo "::error::Export only has $SET_PAGES set pages — refusing to deploy a wiped catalog."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
