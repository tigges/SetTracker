name: Catalog enrich

# Artwork / MusicBrainz + ACRCloud fingerprint gap-fill in selectable modes.
# GitHub-hosted jobs die at 6h and skip Save/Pages — so every expensive step
# has a timeout, continue-on-error, and a DB checkpoint. `full` is sized to
# finish (~3h), not to pack thumbs + 40×20 Identify + File Scan + 400 ISRCs.
#   full  — null thumbs + MB + Identify 20×12 + File Scan 12  [weekly]
#   acr   — Identify 12×8 + File Scan 8 (no thumbs/LLM)       [enrich-request]
#   smoke — tiny ACR check (4×5)                              [creds]
# After a checkpoint exists, dispatches deploy-pages even if a later step fails.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (thumbs+MB+deep ACR) | acr (priority ACR only) | smoke (tiny ACR check)"
        required: true
        default: "acr"
        type: choice
        options:
          - acr
          - smoke
          - full
  # Agents often lack workflow_dispatch; bump on main to start:
  #   data/enrich-request      → acr (fast)
  #   data/enrich-full-request → full (thumbs + MB + deep ACR + filescan)
  push:
    branches: [main]
    paths:
      - "data/enrich-request"
      - "data/enrich-full-request"

permissions:
  contents: read
  actions: write

# Separate lanes per mode so a quick smoke/acr check never queues behind a
# long-running weekly `full` pass (and vice versa).
concurrency:
  group: catalog-enrich-${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'full') || (github.event_name == 'push' && contains(toJson(github.event.head_commit), 'data/enrich-full-request') && 'full') || (github.event_name == 'push' && 'acr') || 'full' }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # Hosted cap is 6h; leave headroom so we never rely on the hard cancel.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Resolve enrich mode
        id: mode
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) MODE="${{ inputs.mode }}" ;;
            push)
              # Prefer full when that request file is in the push.
              if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | grep -qx 'data/enrich-full-request'; then
                MODE="full"
              else
                MODE="acr"
              fi
              ;;
            *)                 MODE="full" ;;   # weekly schedule = full pass
          esac
          case "$MODE" in
            smoke)
              SET_LIMIT=4; MAX_PROBES=5; DO_THUMBS=0; FS_LIMIT=4
              ID_DEADLINE_MS=600000; ID_STEP=15; FS_STEP=15
              TRACK_ID_LIMIT=0; FS_WAIT_MS=600000
              ;;
            acr)
              SET_LIMIT=12; MAX_PROBES=8; DO_THUMBS=0; FS_LIMIT=8
              ID_DEADLINE_MS=2400000; ID_STEP=50; FS_STEP=35
              TRACK_ID_LIMIT=40; FS_WAIT_MS=900000
              ;;
            full)
              SET_LIMIT=20; MAX_PROBES=12; DO_THUMBS=1; FS_LIMIT=12
              ID_DEADLINE_MS=3600000; ID_STEP=75; FS_STEP=40
              TRACK_ID_LIMIT=80; FS_WAIT_MS=1200000
              ;;
            *)     echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          echo "mode=$MODE"           >> "$GITHUB_OUTPUT"
          echo "set_limit=$SET_LIMIT" >> "$GITHUB_OUTPUT"
          echo "max_probes=$MAX_PROBES" >> "$GITHUB_OUTPUT"
          echo "do_thumbs=$DO_THUMBS" >> "$GITHUB_OUTPUT"
          echo "fs_limit=$FS_LIMIT" >> "$GITHUB_OUTPUT"
          echo "id_deadline_ms=$ID_DEADLINE_MS" >> "$GITHUB_OUTPUT"
          echo "id_step=$ID_STEP" >> "$GITHUB_OUTPUT"
          echo "fs_step=$FS_STEP" >> "$GITHUB_OUTPUT"
          echo "fs_wait_ms=$FS_WAIT_MS" >> "$GITHUB_OUTPUT"
          echo "track_id_limit=$TRACK_ID_LIMIT" >> "$GITHUB_OUTPUT"
          echo "Enrich mode=$MODE (sets=$SET_LIMIT probes=$MAX_PROBES fs=$FS_LIMIT thumbs=$DO_THUMBS track_ids=$TRACK_ID_LIMIT id_step=${ID_STEP}m)"

      - name: Restore catalog DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Require catalog
        run: |
          if [ ! -f prisma/dev.db ]; then
            echo "::error::No catalog DB in cache. Run Catalog deep refresh first."
            exit 1
          fi
          npx prisma migrate deploy
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Catalog sets=$SETS"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Catalog too small ($SETS)."
            exit 1
          fi

      - name: Full thumbs + MusicBrainz
        if: steps.mode.outputs.do_thumbs == '1'
        timeout-minutes: 25
        continue-on-error: true
        env:
          THUMBS_DELAY_MS: "120"
          # Null-only — do not re-fetch art that already shipped.
          THUMBS_NULL_ONLY: "1"
          THUMBS_MB_LIMIT: "40"
        run: npm run thumbs

      # Fingerprint sparse sets via ACRCloud (direct — never AudioScout/TrackId).
      # No-op when secrets are unset; never overwrites sourceUrl / sourceName.
      - name: Check ACRCloud secrets
        id: acr
        env:
          ACRCLOUD_HOST: ${{ secrets.ACRCLOUD_HOST }}
          ACRCLOUD_ACCESS_KEY: ${{ secrets.ACRCLOUD_ACCESS_KEY }}
          ACRCLOUD_ACCESS_SECRET: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
        run: |
          # Trim — pasted secrets often pick up trailing newlines and fail with ACR 3014.
          HOST=$(printf '%s' "$ACRCLOUD_HOST" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          KEY=$(printf '%s' "$ACRCLOUD_ACCESS_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          SECRET=$(printf '%s' "$ACRCLOUD_ACCESS_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "host_len=${#HOST} key_len=${#KEY} secret_len=${#SECRET}"
          if [ -n "$HOST" ] && [ -n "$KEY" ] && [ -n "$SECRET" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
            {
              echo "ACRCLOUD_HOST=$HOST"
              echo "ACRCLOUD_ACCESS_KEY=$KEY"
              echo "ACRCLOUD_ACCESS_SECRET=$SECRET"
            } >> "$GITHUB_ENV"
            echo "ACRCloud credentials present — fingerprint enrich will run."
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::warning::ACRCLOUD_HOST / ACRCLOUD_ACCESS_KEY / ACRCLOUD_ACCESS_SECRET not set. Fingerprint enrich will no-op. Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
          fi

      - name: Install ffmpeg
        if: steps.acr.outputs.configured == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Optional YouTube cookies for yt-dlp
        if: steps.acr.outputs.configured == '1'
        env:
          YT_COOKIES: ${{ secrets.ACRCLOUD_YTDLP_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/yt-cookies.txt"
            echo "ACRCLOUD_YTDLP_COOKIES=$RUNNER_TEMP/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "YouTube cookies present for yt-dlp."
            npx tsx scripts/inspect-yt-cookies.ts --path "$RUNNER_TEMP/yt-cookies.txt"
          else
            echo "::notice::No ACRCLOUD_YTDLP_COOKIES secret. Cookies rarely help on GitHub IPs anyway — File Scanning is the CI path for YouTube."
          fi

      - name: ACRCloud fingerprint enrich
        id: fingerprint
        if: steps.acr.outputs.configured == '1'
        timeout-minutes: ${{ fromJSON(steps.mode.outputs.id_step) }}
        continue-on-error: true
        env:
          ACRCLOUD_ENABLED: "1"
          # Severity-ranked sparse queue (SC/hearthis first via compareSparseSetCandidates).
          ACRCLOUD_SET_LIMIT: ${{ steps.mode.outputs.set_limit }}
          ACRCLOUD_SAMPLE_SEC: "12"
          ACRCLOUD_STEP_SEC: "60"
          ACRCLOUD_MAX_PROBES_PER_SET: ${{ steps.mode.outputs.max_probes }}
          ACRCLOUD_DEADLINE_MS: ${{ steps.mode.outputs.id_deadline_ms }}
          ACRCLOUD_MIN_SCORE: "55"
          ACRCLOUD_MIN_IDENTIFIED: "4"
          ACRCLOUD_ALLOW_YOUTUBE: "0"
          ACRCLOUD_ALLOW_YOUTUBE_PRIORITY: "1"
          ACRCLOUD_IDENTIFY_YOUTUBE: "0"
          ACRCLOUD_YT_FAIL_FAST: "1"
          ACRCLOUD_FS_TOKEN: ${{ secrets.ACRCLOUD_FS_TOKEN }}
          ACRCLOUD_FS_CONTAINER_ID: ${{ secrets.ACRCLOUD_FS_CONTAINER_ID }}
          ACRCLOUD_EVENT_SLUGS: "street-parade,tomorrowland,ultra-miami,edc-lv,nature-one"
        run: npm run enrich:fingerprint

      - name: Save checkpoint after Identify
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}-1identify

      # Server-side YouTube fingerprinting (no yt-dlp / cookies / CI bot walls).
      # YouTube-only sparse queue — does not share Identify's SC-first ranking,
      # so TML radio/academy mixes cannot crowd festival playbacks out of the slice.
      # No-op unless ACRCLOUD_FS_TOKEN + ACRCLOUD_FS_CONTAINER_ID secrets exist.
      - name: ACRCloud File Scanning (YouTube)
        id: filescan
        if: steps.acr.outputs.configured == '1'
        timeout-minutes: ${{ fromJSON(steps.mode.outputs.fs_step) }}
        continue-on-error: true
        env:
          ACRCLOUD_FS_TOKEN: ${{ secrets.ACRCLOUD_FS_TOKEN }}
          ACRCLOUD_FS_CONTAINER_ID: ${{ secrets.ACRCLOUD_FS_CONTAINER_ID }}
          ACRCLOUD_FS_REGION: ${{ secrets.ACRCLOUD_FS_REGION }}
          ACRCLOUD_FS_MIN_SCORE: "55"
          ACRCLOUD_FS_SET_LIMIT: ${{ steps.mode.outputs.fs_limit }}
          ACRCLOUD_FS_TIMEOUT_MS: ${{ steps.mode.outputs.fs_wait_ms }}
          ACRCLOUD_EVENT_SLUGS: "street-parade,tomorrowland,ultra-miami,edc-lv,nature-one"
        run: npm run enrich:filescan

      - name: Save checkpoint after File Scan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}-2filescan

      # Fill-null ISRC / canonical Beatport on high-play catalog tracks.
      # Deezer + MusicBrainz + TrackRadar + AudD — never scrape Beatport HTML.
      # Writes the cached DB (TRACK_ID_APPLY) and data/track-id-pins.json.
      - name: Beatport / ISRC enrich
        if: steps.mode.outputs.track_id_limit != '0'
        timeout-minutes: 25
        env:
          TRACK_ID_APPLY: "1"
          TRACK_ID_LIMIT: ${{ steps.mode.outputs.track_id_limit }}
          TRACK_ID_HELD_LIMIT: "8"
          TRACK_ID_DELAY_MS: "0"
          TRACKRADAR_ARCHIVE: "0"
        run: npm run research:track-ids
        continue-on-error: true

      - name: LLM handle research
        if: steps.mode.outputs.do_thumbs == '1'
        timeout-minutes: 12
        env:
          CLAUDE_AGENT_API: ${{ secrets.CLAUDE_AGENT_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_AGENT_API || secrets.GEMINI || secrets.GOOGLE_API_KEY }}
          LLM_RESEARCH_LIMIT: "8"
          LLM_QUALITY: "1"
        run: npm run research:handles
        continue-on-error: true

      - name: Save enriched catalog DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      # Single deployer: hand off to deploy-pages.yml (restores the saved DB,
      # builds, publishes). Ships whatever landed in a checkpoint — do not wait
      # for a green Identify if File Scan / ISRC already wrote rows.
      - name: Dispatch Pages deploy
        if: always() && hashFiles('prisma/dev.db') != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: context.ref,
              inputs: { mode: 'fast' },
            });
            core.info('Dispatched Deploy to GitHub Pages (fast) after enrich (mode=${{ steps.mode.outputs.mode }}).');
