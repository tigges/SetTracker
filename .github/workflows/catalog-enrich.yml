name: Catalog enrich (weekly)

# Full artwork refresh + MusicBrainz + ACRCloud fingerprint gap-fill.
# Kept off the 6-hour deep path. After a successful enrich, triggers a fast
# Pages deploy so fingerprint IDs ship without waiting for the next push.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: catalog-enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Restore catalog DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}
          restore-keys: |
            setradar-db-

      - name: Require catalog
        run: |
          if [ ! -f prisma/dev.db ]; then
            echo "::error::No catalog DB in cache. Run Catalog deep refresh first."
            exit 1
          fi
          npx prisma migrate deploy
          SETS=$(python3 -c "import sqlite3; print(sqlite3.connect('prisma/dev.db').execute('select count(*) from \"Set\"').fetchone()[0])")
          echo "Catalog sets=$SETS"
          if [ "${SETS:-0}" -lt 50 ]; then
            echo "::error::Catalog too small ($SETS)."
            exit 1
          fi

      - name: Full thumbs + MusicBrainz
        env:
          THUMBS_DELAY_MS: "120"
          THUMBS_NULL_ONLY: "0"
          THUMBS_MB_LIMIT: "80"
        run: npm run thumbs

      # Fingerprint sparse sets via ACRCloud (direct — never AudioScout/TrackId).
      # No-op when secrets are unset; never overwrites sourceUrl / sourceName.
      - name: Check ACRCloud secrets
        id: acr
        env:
          ACRCLOUD_HOST: ${{ secrets.ACRCLOUD_HOST }}
          ACRCLOUD_ACCESS_KEY: ${{ secrets.ACRCLOUD_ACCESS_KEY }}
          ACRCLOUD_ACCESS_SECRET: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
        run: |
          if [ -n "$ACRCLOUD_HOST" ] && [ -n "$ACRCLOUD_ACCESS_KEY" ] && [ -n "$ACRCLOUD_ACCESS_SECRET" ]; then
            echo "configured=1" >> "$GITHUB_OUTPUT"
            echo "ACRCloud credentials present — fingerprint enrich will run."
          else
            echo "configured=0" >> "$GITHUB_OUTPUT"
            echo "::warning::ACRCLOUD_HOST / ACRCLOUD_ACCESS_KEY / ACRCLOUD_ACCESS_SECRET not set. Fingerprint enrich will no-op. Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
          fi

      - name: Install ffmpeg
        if: steps.acr.outputs.configured == '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: ACRCloud fingerprint enrich
        id: fingerprint
        env:
          ACRCLOUD_ENABLED: "1"
          ACRCLOUD_HOST: ${{ secrets.ACRCLOUD_HOST }}
          ACRCLOUD_ACCESS_KEY: ${{ secrets.ACRCLOUD_ACCESS_KEY }}
          ACRCLOUD_ACCESS_SECRET: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
          ACRCLOUD_SET_LIMIT: "12"
          ACRCLOUD_SAMPLE_SEC: "12"
          ACRCLOUD_STEP_SEC: "90"
          ACRCLOUD_MIN_SCORE: "70"
          ACRCLOUD_MIN_IDENTIFIED: "4"
          # Prefer SC/hearthis progressive; YT left off (bot walls / ToS).
          ACRCLOUD_ALLOW_YOUTUBE: "0"
        run: npm run enrich:fingerprint

      - name: Save enriched catalog DB
        uses: actions/cache/save@v4
        with:
          path: prisma/dev.db
          key: setradar-db-${{ github.run_id }}

      # Ship fingerprint IDs to Pages without waiting for the next code push.
      - name: Trigger fast Pages deploy
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: context.ref,
              inputs: { mode: 'fast' },
            });
            core.info('Dispatched Deploy to GitHub Pages (fast).');
